<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" fill="none">
  <title>Image placeholder</title>
  <defs>
    <linearGradient id="warp" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#CBC6BF"/>
      <stop offset="0.18" stop-color="#D8D3CC"/>
      <stop offset="0.5" stop-color="#E4DFD8"/>
      <stop offset="0.82" stop-color="#D3CEC7"/>
      <stop offset="1" stop-color="#C6C1BA"/>
    </linearGradient>
    <linearGradient id="weft" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#AAA8A8"/>
      <stop offset="0.18" stop-color="#9F9E9F"/>
      <stop offset="0.5" stop-color="#929294"/>
      <stop offset="0.82" stop-color="#A09FA0"/>
      <stop offset="1" stop-color="#AAA8A8"/>
    </linearGradient>
    <filter id="thread-depth" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="7.5" stdDeviation="7.5" flood-color="#77736D" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="#F3F0EA"/>

  <g fill="url(#warp)" filter="url(#thread-depth)">
    <rect x="75" width="150" height="1200"/>
    <rect x="300" width="150" height="1200"/>
    <rect x="525" width="150" height="1200"/>
    <rect x="750" width="150" height="1200"/>
    <rect x="975" width="150" height="1200"/>
  </g>

  <g fill="url(#weft)" filter="url(#thread-depth)">
    <rect y="75" width="1200" height="150"/>
    <rect y="300" width="1200" height="150"/>
    <rect y="525" width="1200" height="150"/>
    <rect y="750" width="1200" height="150"/>
    <rect y="975" width="1200" height="150"/>
  </g>

  <g fill="url(#warp)" filter="url(#thread-depth)">
    <rect x="75" y="75" width="150" height="150"/>
    <rect x="525" y="75" width="150" height="150"/>
    <rect x="975" y="75" width="150" height="150"/>
    <rect x="300" y="300" width="150" height="150"/>
    <rect x="750" y="300" width="150" height="150"/>
    <rect x="75" y="525" width="150" height="150"/>
    <rect x="525" y="525" width="150" height="150"/>
    <rect x="975" y="525" width="150" height="150"/>
    <rect x="300" y="750" width="150" height="150"/>
    <rect x="750" y="750" width="150" height="150"/>
    <rect x="75" y="975" width="150" height="150"/>
    <rect x="525" y="975" width="150" height="150"/>
    <rect x="975" y="975" width="150" height="150"/>
  </g>
